name: Stage congressional roster
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: congressional-roster-staging
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check ingestion configuration
        id: configuration
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: |
          if [ -z "$CONGRESS_API_KEY" ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Ingestion skipped: configure the CONGRESS_API_KEY repository secret. No roster was fetched or published.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.configuration.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.configuration.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.configuration.outputs.enabled == 'true'
      - name: Validate ingestion adapters
        if: steps.configuration.outputs.enabled == 'true'
        run: npx vitest run src/ingestion/ingestion.test.ts
      - name: Capture complete current roster
        if: steps.configuration.outputs.enabled == 'true'
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: node --import tsx scripts/ingestion/import.mjs members --out "$RUNNER_TEMP/scorecard-roster"
      - name: Retain review artifact
        if: steps.configuration.outputs.enabled == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: roster-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scorecard-roster/
          if-no-files-found: error
          retention-days: 14
      - name: Store capture for staff review
        if: steps.configuration.outputs.enabled == 'true' && success() && github.ref == 'refs/heads/main'
        env:
          ROSTER_INGESTION_TOKEN: ${{ secrets.ROSTER_INGESTION_TOKEN }}
          SCORECARD_ROSTER_URL: ${{ vars.SCORECARD_ROSTER_URL }}
        run: |
          if [ -z "$ROSTER_INGESTION_TOKEN" ] || [ -z "$SCORECARD_ROSTER_URL" ]; then
            echo 'Staff roster storage skipped: configure the roster URL and token.' >> "$GITHUB_STEP_SUMMARY"
          else
            node scripts/ingestion/store-roster.mjs "$RUNNER_TEMP/scorecard-roster"
          fi
      - name: Summarize review boundary
        if: steps.configuration.outputs.enabled == 'true' && success()
        run: echo 'Complete roster staged with exact source captures. Artifact retained for 14 days. Preview and apply the stored capture in a draft, then submit for editorial review. This workflow never publishes or deactivates members.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report failure
        if: failure()
        run: echo 'Roster staging failed. No import was published. Inspect the failing step; the last published roster remains unchanged.' >> "$GITHUB_STEP_SUMMARY"
